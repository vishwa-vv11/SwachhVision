services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: civicai_postgis
    restart: always
    environment:
      POSTGRES_USER: civicai_user
      POSTGRES_PASSWORD: civicai_password
      POSTGRES_DB: civicai_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicai_user -d civicai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
